name: Task (maintainer)
description: Planned work from the project backlog. Mainly for the maintainer.
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this task is done, and why it is needed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist. The task is done when every box is ticked.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Depends on
      description: Issues that must be closed first.
      placeholder: "#12, #15 (or none)"

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must
        - Should
        - Could
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - S (one session)
        - M (a few sessions)
        - L (several weekends)
    validations:
      required: true

  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      description: Applies to every task.
      options:
        - label: Code and tests written; CI is green.
        - label: Doxygen comments and README updated where needed.
        - label: CHANGELOG entry added under [Unreleased] (marked BREAKING if the API changes).
        - label: PR description contains "Fixes #<this issue>".
